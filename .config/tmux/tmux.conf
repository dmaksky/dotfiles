# Requires tmux >= 3.3. No plugins.
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -s escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g mouse off
set -g default-terminal tmux-256color
# Fixed indices preserve tmux defaults and avoid duplicates on reload.
set -s terminal-features[10] 'xterm-kitty:RGB'
set -s terminal-features[11] 'xterm-256color:RGB'
set -s terminal-features[12] 'alacritty:RGB'
set -s set-clipboard on

bind r source-file "~/.config/tmux/tmux.conf" \; display-message 'Configuration reloaded'
bind c new-window -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-p previous-window
bind -r C-n next-window
bind C-l send-keys C-l
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z
bind C-s setw synchronize-panes \; display-message 'Synchronize: #{pane_synchronized}'
bind s choose-tree -sZ -O name

# Foreground process check works with both BSD and procps ps.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]*/)?(nvim|vim|view|vimdiff|nvimdiff)( +|$)'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

setw -g mode-keys vi
bind Escape copy-mode
bind p paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# Prefer the local clipboard provider; otherwise tmux uses OSC 52.
set -s copy-command ''
if-shell 'command -v pbcopy >/dev/null 2>&1' 'set -s copy-command pbcopy' {
  if-shell 'test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null 2>&1' 'set -s copy-command wl-copy' {
    if-shell 'test -n "$DISPLAY" && command -v xclip >/dev/null 2>&1' 'set -s copy-command "xclip -selection clipboard"'
  }
}
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

bind O display-popup -d '#{pane_current_path}' -w 80% -h 80% -E
bind e display-menu -T 'Quick Menu' -x C -y C \
  'New Window' n 'new-window -c "#{pane_current_path}"' \
  'Split Left/Right' h 'split-window -h -c "#{pane_current_path}"' \
  'Split Top/Bottom' v 'split-window -v -c "#{pane_current_path}"' \
  'Zoom' z 'resize-pane -Z' \
  'Synchronize' s 'set-window-option synchronize-panes' \
  'Close Pane' x 'confirm-before -p "Close pane? (y/n)" kill-pane'
bind P pipe-pane -o 'umask 077; mkdir -p "${XDG_STATE_HOME:-$HOME/.local/state}/tmux"; cat >> "${XDG_STATE_HOME:-$HOME/.local/state}/tmux/pane-#{pid}-#{pane_id}.log"' \; display-message 'Pane logging toggled'

# Light palette, native formats only (no commands on each status redraw).
set -g status-position top
set -g status-interval 15
set -g status-justify centre
set -g status-style 'bg=#eff1f5,fg=#4c4f69'
set -g status-left-length 24
set -g status-left '#[bg=#8839ef,fg=#eff1f5,bold] #S #[default] '
set -g status-right-length 60
set -g status-right '#[fg=#d20f39,bold]#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#{?pane_synchronized,SYNC ,}#[default]#{?#{>=:#{client_width},100}, %a %d %b,} %H:%M '
setw -g window-status-format ' #I:#W#{?window_activity_flag,*,} '
setw -g window-status-current-format '#[fg=#1e66f5,bg=#ccd0da,bold] #I:#W #[default]'
set -g pane-border-style 'fg=#bcc0cc'
set -g pane-active-border-style 'fg=#8839ef'
set -g message-style 'bg=#ccd0da,fg=#4c4f69'
setw -g mode-style 'bg=#bcc0cc,fg=#4c4f69'
setw -g monitor-activity on
setw -g visual-activity off
