set -g prefix C-a
unbind C-b

set -sg escape-time 1
set -g base-index 1
setw -g pane-base-index 1

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
bind C-a send-prefix
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g mouse on

set -g default-terminal "screen-256color"
set -a terminal-features "tmux-256color:RGB"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_flavor "latte"
set -g @catppuccin_window_status_style "basic"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-right "#{E:@catppuccin_status_session}"
set -g status-left ""
set -g status-position top
set -g status-justify left

#set -g status-left "#S"
#set -g status-right ""
#set -g status-justify absolute-centre
#set -g status-style "bg=default"
#set -g window-status-style "bg=default"
#set -g message-style "bg=default"
#set -g window-status-current-style "fg=#5A6FA6 bg=default bold"
#set -g window-status-activity-style "fg=#8A2BE2 bg=default bold"
#setw -g mode-style "bg=gray"

set -g status-interval 60
setw -g monitor-activity on
set -g visual-activity off

setw -g mode-keys vi
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

unbind Up
bind Up new-window -d -n tmp \; swap-pane -s tmp.1 \; select-window -t tmp
unbind Down
bind Down last-window \; swap-pane -s tmp.1 \; kill-window -t tmp

bind P pipe-pane -o "cat >> ~/#W.log" \; display "Toggled logging to ~/#W.log"

unbind v
unbind n
bind v send-keys "/Users/d.akshevskiy/.local/share/tmux/tmux-panes -h" C-m
bind n send-keys "/Users/d.akshevskiy/.local/share/tmux/tmux-panes -v" C-m
