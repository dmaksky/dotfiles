# General
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -s focus-events on

set -s escape-time 10
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g default-terminal 'tmux-256color'
set -s set-clipboard external

# Windows and panes
bind c new-window -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Utilities
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'Reloaded'
bind s choose-tree -sZ
bind O display-popup -E -d '#{pane_current_path}' -w 80% -h 80%
bind C-s setw synchronize-panes

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Appearance
set -g status-position top
set -g status-style 'bg=#eff1f5,fg=#4c4f69'
set -g status-left '#[fg=#8839ef,bold] #S #[default]'
set -g status-right '#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#{?pane_synchronized,SYNC ,}%H:%M '

setw -g window-status-current-style 'fg=#1e66f5,bg=#ccd0da,bold'
set -g pane-border-style 'fg=#bcc0cc'
set -g pane-active-border-style 'fg=#8839ef'
