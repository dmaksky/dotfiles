add_newline = true
command_timeout = 500

format = "$directory$git_branch$line_break$character"

[directory]
style = "bold blue"
truncation_length = 0
truncate_to_repo = false

[git_branch]
style = "italic magenta"
format = "[$branch]($style) "

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold magenta)"
