# General
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -s focus-events on
set -s escape-time 10

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

set -g default-terminal 'tmux-256color'
set -s set-clipboard external

# Windows and panes
bind c new-window -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Utilities
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'Reloaded'
bind s choose-tree -sZ
bind O display-popup -E -d '#{pane_current_path}' -w 80% -h 80%
bind C-s setw synchronize-panes

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Activity notifications
set -w -g monitor-activity on
set -g activity-action other
set -g visual-activity off

# Disable silence notifications
set -w -g monitor-silence 0
set -g silence-action none

# Highlight windows with activity
setw -g window-status-activity-style 'fg=#ffffff,bg=#df8e1d,bold'

# Status bar
set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'bg=#eff1f5,fg=#4c4f69'
set -g status-interval 5

# Session name
set -g status-left-length 30
set -g status-left '#[fg=#ffffff,bg=#8839ef,bold] #S #[default]'

# Right status
set -g status-right-length 60
set -g status-right '#[fg=#ffffff,bg=#8839ef,bold]#{?client_prefix, PREFIX ,}#[default]#{?window_zoomed_flag,ZOOM ,}#{?pane_synchronized,SYNC ,} %H:%M '

# Windows
setw -g window-status-style 'fg=#4c4f69,bg=#eff1f5'
setw -g window-status-current-style 'fg=#ffffff,bg=#1e66f5,bold'
setw -g window-status-activity-style 'fg=#ffffff,bg=#df8e1d,bold'
setw -g window-status-bell-style 'fg=#ffffff,bg=#d20f39,bold'

set -g window-status-separator ''

setw -g window-status-format '#{?window_silence_flag,#[fg=#ffffff]#[bg=#df8e1d]#[bold],} #I:#W#{window_flags} #[default]'
setw -g window-status-current-format ' #I:#W#{window_flags} '

# Pane borders
set -g pane-border-style 'fg=#bcc0cc'
set -g pane-active-border-style 'fg=#8839ef'
